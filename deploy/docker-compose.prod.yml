version: '3.8'

services:
  backend:
    build:
      context: ./backend/backend
      dockerfile: Dockerfile
    container_name: karaya_backend
    restart: always
    env_file:
      - .env
    ports:
      - "5000:5000"
    networks:
      - app-network

  provider-frontend:
    build:
      context: ./provider-frontend/provider/frontend
      dockerfile: Dockerfile
    container_name: karaya_provider_frontend
    restart: always
    # Nginx in the frontend container runs on port 80
    expose:
      - "80"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: karaya_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment these when you have SSL certificates
      # - /etc/letsencrypt:/etc/letsencrypt:ro
      # - /var/www/certbot:/var/www/certbot
    depends_on:
      - backend
      - provider-frontend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
